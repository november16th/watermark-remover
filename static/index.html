<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영상 워터마크 정밀 제거기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 24px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 1080px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        
        header { text-align: center; margin-bottom: 10px; }
        header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        header p { color: var(--text-dim); font-size: 0.95rem; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        
        /* Upload Area */
        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-box:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .upload-box input { display: none; }
        .upload-icon { font-size: 2.2rem; margin-bottom: 10px; }

        /* Workspace Grid */
        .workspace { display: none; grid-template-columns: auto 360px; gap: 24px; justify-content: center; }
        @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

        /* Canvas Wrapper - 9:16 세로 영상이 잘림 없이 한눈에 들어오도록 최적화 */
        .canvas-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        canvas { display: block; cursor: crosshair; outline: none; }

        /* Sidebar Controls */
        .sidebar { display: flex; flex-direction: column; gap: 16px; }
        .sidebar-title { font-size: 1rem; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .preview-box {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .preview-box canvas { margin: 0 auto; max-width: 100%; border: 1px solid #475569; border-radius: 4px; }
        .info-text { font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        /* Progress Modal: 화면 정중앙 로딩 오버레이 */
        #progress-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #progress-modal.active { display: flex; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 30px 40px;
            border-radius: 14px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Drag overlay on entire window */
        #global-drop-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.88);
            border: 4px dashed #3b82f6;
            z-index: 9998;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
        }
        #global-drop-overlay.active {
            display: flex;
            pointer-events: auto;
        }
        #global-drop-overlay * {
            pointer-events: none;
        }
        #global-drop-overlay h2 { font-size: 1.6rem; color: #fff; margin-top: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <!-- Center Loading Modal -->
    <div id="progress-modal">
        <div class="modal-box">
            <div class="spinner"></div>
            <h3 id="progress-status" style="font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 8px;">워터마크 제거 중...</h3>
            <p id="progress-percent" style="font-size: 1.4rem; font-weight: 700; color: #60a5fa; margin-bottom: 14px;">0%</p>
            <div style="width: 100%; height: 8px; background: #090d16; border-radius: 4px; overflow: hidden;">
                <div id="progress-fill" style="width: 0%; height: 100%; background: #3b82f6; transition: width 0.3s;"></div>
            </div>
        </div>
    </div>

    <!-- Global Drag and Drop Overlay -->
    <div id="global-drop-overlay">
        <div style="font-size: 3.5rem;">📥</div>
        <h2>Drop video to upload</h2>
    </div>

    <div class="container">
        <header>
            <h1 style="font-size: 1.6rem; font-weight: 700;">mp4 watermark remover</h1>
        </header>

        <!-- Upload Box -->
        <div class="card" id="upload-card">
            <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">🎬</div>
                <h3 style="font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 6px;">Drop your MP4 here or click to browse</h3>
                <p class="info-text">Supports MP4, MOV, WebM</p>
                <input type="file" id="file-input" accept="video/*">
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="workspace" id="workspace">
            <div class="card" style="padding: 12px;">
                <div class="canvas-container">
                    <canvas id="main-canvas"></canvas>
                </div>
                <p class="info-text" style="text-align: center; margin-top: 8px;">
                    워터마크 위치를 클릭하거나 드래그하여 지정하세요. (방향키 ⬅️➡️⬆️⬇️ 로 1px 미세조정, Shift+방향키: 5px)
                </p>
            </div>

            <!-- Controls -->
            <div class="sidebar">
                <div class="card">
                    <div class="sidebar-title">마스크 미리보기</div>
                    <div class="preview-box" style="margin-top: 12px;">
                        <canvas id="mask-canvas" width="120" height="120"></canvas>
                        <p class="info-text" id="mask-status">워터마크 영역을 지정하세요.</p>
                    </div>

                    <div style="margin-top: 14px;">
                        <label style="font-size: 0.85rem; color: var(--text-dim);">마스크 여유 크기</label>
                        <input type="range" id="dilate-slider" min="2" max="12" value="4" style="width: 100%; margin-top: 4px;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim);">
                            <span>2px</span>
                            <span id="dilate-val">4px</span>
                            <span>12px</span>
                        </div>
                    </div>
                </div>

                <!-- 수동 픽셀 좌표 지정 카드 -->
                <div class="card">
                    <div class="sidebar-title">좌표 설정</div>
                    <p class="info-text" style="margin-top: 6px;">영상 위를 클릭하면 좌표가 자동 입력됩니다.</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                        <div>
                            <label style="font-size: 0.78rem; color: var(--text-dim);">X 위치</label>
                            <input type="number" id="input-x" style="width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; margin-top: 2px;" onchange="onManualCoordChange()">
                        </div>
                        <div>
                            <label style="font-size: 0.78rem; color: var(--text-dim);">Y 위치</label>
                            <input type="number" id="input-y" style="width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; margin-top: 2px;" onchange="onManualCoordChange()">
                        </div>
                        <div>
                            <label style="font-size: 0.78rem; color: var(--text-dim);">너비 (W)</label>
                            <input type="number" id="input-w" value="70" style="width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; margin-top: 2px;" onchange="onManualCoordChange()">
                        </div>
                        <div>
                            <label style="font-size: 0.78rem; color: var(--text-dim);">높이 (H)</label>
                            <input type="number" id="input-h" value="70" style="width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; margin-top: 2px;" onchange="onManualCoordChange()">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <button class="btn" id="start-btn" disabled onclick="startProcessing()">
                        워터마크 제거 시작
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const workspace = document.getElementById('workspace');
        const mainCanvas = document.getElementById('main-canvas');
        const maskCanvas = document.getElementById('mask-canvas');
        const ctx = mainCanvas.getContext('2d');
        const maskCtx = maskCanvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const dilateSlider = document.getElementById('dilate-slider');
        const dilateVal = document.getElementById('dilate-val');

        let videoFile = null;
        let originalImg = null;
        let isDragging = false;
        let startX = 0, startY = 0;
        let selectedBox = null; // {x, y, w, h} in original image coords
        let scale = 1.0;

        dilateSlider.oninput = () => {
            dilateVal.textContent = dilateSlider.value + 'px';
            if (selectedBox) updateMaskPreview();
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        };

        const globalOverlay = document.getElementById('global-drop-overlay');
        let dragCounter = 0;

        // Prevent browser default file open behavior across the entire window
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(name => {
            window.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
            document.body.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // Global drag-and-drop overlay detection
        window.addEventListener('dragenter', (e) => {
            dragCounter++;
            globalOverlay.classList.add('active');
        });

        window.addEventListener('dragleave', (e) => {
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                globalOverlay.classList.remove('active');
            }
        });

        window.addEventListener('drop', (e) => {
            dragCounter = 0;
            globalOverlay.classList.remove('active');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Dedicated drop-zone handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file) return;
            const isVideo = (file.type && file.type.startsWith('video/')) || file.name.match(/\.(mp4|mov|avi|mkv|webm|m4v)$/i);
            if (!isVideo) {
                return alert('Please upload a video file (.mp4, .mov, etc.).');
            }

            videoFile = file;

            // Reset modal & progress
            document.getElementById('progress-modal').classList.remove('active');
            document.getElementById('progress-fill').style.width = '0%';

            // Show upload loading state
            document.getElementById('upload-card').style.display = 'block';
            workspace.style.display = 'none';
            dropZone.innerHTML = '<div class="upload-icon">⏳</div><h3 style="font-size: 1.15rem; font-weight: 600; color: #fff;">Analyzing video...</h3>';

            const formData = new FormData();
            formData.append('video', file);

            fetch('/api/extract-frame', { method: 'POST', body: formData })
                .then(r => {
                    if (!r.ok) throw new Error('Server returned status ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (data.error) return alert(data.error);
                    
                    const img = new Image();
                    img.onload = () => {
                        originalImg = img;
                        initCanvas();
                        document.getElementById('upload-card').style.display = 'none';
                        workspace.style.display = 'grid';

                        // Restore drop zone markup for next upload
                        dropZone.innerHTML = `
                            <div class="upload-icon">🎬</div>
                            <h3 style="font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 6px;">Drop your MP4 here or click to browse</h3>
                            <p class="info-text">Supports MP4, MOV, WebM</p>
                            <input type="file" id="file-input" accept="video/*">
                        `;
                        document.getElementById('file-input').onchange = (e) => {
                            if (e.target.files.length > 0) handleFile(e.target.files[0]);
                        };

                        // Auto suggested box
                        if (data.suggested_box) {
                            selectedBox = data.suggested_box;
                            drawMain();
                            syncInputsWithBox();
                            updateMaskPreview();
                            startBtn.disabled = false;
                        }
                    };
                    img.src = data.frame_url + '?t=' + Date.now();
                })
                .catch(err => {
                    alert('Upload failed: ' + err);
                    dropZone.innerHTML = `
                        <div class="upload-icon">🎬</div>
                        <h3 style="font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 6px;">Drop your MP4 here or click to browse</h3>
                        <p class="info-text">Supports MP4, MOV, WebM</p>
                        <input type="file" id="file-input" accept="video/*">
                    `;
                    document.getElementById('file-input').onchange = (e) => {
                        if (e.target.files.length > 0) handleFile(e.target.files[0]);
                    };
                });
        }

        function initCanvas() {
            // 9:16 비율 세로 영상이 스크롤 없이 화면 한눈에 보이도록 브라우저 높이(vh)에 맞게 스케일링
            const availableHeight = Math.min(window.innerHeight - 180, 780);
            const scaleByH = availableHeight / originalImg.height;
            const scaleByW = 440 / originalImg.width;
            scale = Math.min(scaleByH, scaleByW, 1.0);

            mainCanvas.width = Math.round(originalImg.width * scale);
            mainCanvas.height = Math.round(originalImg.height * scale);
            drawMain();
        }

        function syncInputsWithBox() {
            if (!selectedBox) return;
            document.getElementById('input-x').value = selectedBox.x;
            document.getElementById('input-y').value = selectedBox.y;
            document.getElementById('input-w').value = selectedBox.w;
            document.getElementById('input-h').value = selectedBox.h;
        }

        function onManualCoordChange() {
            const x = parseInt(document.getElementById('input-x').value) || 0;
            const y = parseInt(document.getElementById('input-y').value) || 0;
            const w = parseInt(document.getElementById('input-w').value) || 60;
            const h = parseInt(document.getElementById('input-h').value) || 60;

            selectedBox = { x, y, w, h };
            drawMain();
            updateMaskPreview();
            startBtn.disabled = false;
        }

        function drawMain() {
            ctx.drawImage(originalImg, 0, 0, mainCanvas.width, mainCanvas.height);
            if (selectedBox) {
                const sx = selectedBox.x * scale;
                const sy = selectedBox.y * scale;
                const sw = selectedBox.w * scale;
                const sh = selectedBox.h * scale;

                // Selection Box
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, sw, sh);
                ctx.fillStyle = 'rgba(234, 179, 8, 0.18)';
                ctx.fillRect(sx, sy, sw, sh);

                ctx.font = '12px sans-serif';
                ctx.fillStyle = '#eab308';
                ctx.fillText(`워터마크: (${selectedBox.x}, ${selectedBox.y}) ${selectedBox.w}x${selectedBox.h}`, Math.max(10, sx), Math.max(16, sy - 6));
            }
        }

        let dragMoved = false;

        // Mouse Down: 드래그 시작 또는 단순 클릭 준비
        mainCanvas.onmousedown = (e) => {
            if (document.activeElement && document.activeElement !== document.body) {
                document.activeElement.blur();
            }
            const rect = mainCanvas.getBoundingClientRect();
            startX = (e.clientX - rect.left);
            startY = (e.clientY - rect.top);
            isDragging = true;
            dragMoved = false;
        };

        mainCanvas.onmousemove = (e) => {
            if (!isDragging) return;
            const rect = mainCanvas.getBoundingClientRect();
            const currX = (e.clientX - rect.left);
            const currY = (e.clientY - rect.top);

            const dist = Math.hypot(currX - startX, currY - startY);
            if (dist > 5) {
                dragMoved = true;
                const x = Math.min(startX, currX);
                const y = Math.min(startY, currY);
                const w = Math.abs(currX - startX);
                const h = Math.abs(currY - startY);

                selectedBox = {
                    x: Math.round(x / scale),
                    y: Math.round(y / scale),
                    w: Math.round(w / scale),
                    h: Math.round(h / scale)
                };
                drawMain();
                syncInputsWithBox();
            }
        };

        mainCanvas.onmouseup = (e) => {
            if (!isDragging) return;
            isDragging = false;

            // 단순 클릭인 경우: 클릭한 지점의 픽셀 좌표를 중심으로 워터마크 박스 자동 배치
            if (!dragMoved) {
                const rect = mainCanvas.getBoundingClientRect();
                const clickX = (e.clientX - rect.left);
                const clickY = (e.clientY - rect.top);

                const origX = Math.round(clickX / scale);
                const origY = Math.round(clickY / scale);

                const w = parseInt(document.getElementById('input-w').value) || 70;
                const h = parseInt(document.getElementById('input-h').value) || 70;

                selectedBox = {
                    x: Math.max(0, origX - Math.round(w / 2)),
                    y: Math.max(0, origY - Math.round(h / 2)),
                    w: w,
                    h: h
                };
                drawMain();
                syncInputsWithBox();
            }

            if (selectedBox && selectedBox.w > 10 && selectedBox.h > 10) {
                updateMaskPreview();
                startBtn.disabled = false;
            }
        };

        let maskPreviewTimer = null;
        function debouncedMaskPreview(delay = 120) {
            if (maskPreviewTimer) clearTimeout(maskPreviewTimer);
            maskPreviewTimer = setTimeout(() => {
                updateMaskPreview();
            }, delay);
        }

        // 키보드 방향키(상/하/좌/우) 미세조정: 1px 이동 (Shift 키와 함께 누르면 5px 이동)
        window.addEventListener('keydown', (e) => {
            if (!selectedBox || !originalImg || workspace.style.display === 'none') return;

            // 좌표 입력 필드(input/textarea)에 직접 입력 중일 때는 기본 커서 이동 허용
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                return;
            }

            const step = e.shiftKey ? 5 : 1;
            let moved = false;

            if (e.key === 'ArrowLeft') {
                selectedBox.x = Math.max(0, selectedBox.x - step);
                moved = true;
            } else if (e.key === 'ArrowRight') {
                selectedBox.x = Math.min(originalImg.width - selectedBox.w, selectedBox.x + step);
                moved = true;
            } else if (e.key === 'ArrowUp') {
                selectedBox.y = Math.max(0, selectedBox.y - step);
                moved = true;
            } else if (e.key === 'ArrowDown') {
                selectedBox.y = Math.min(originalImg.height - selectedBox.h, selectedBox.y + step);
                moved = true;
            }

            if (moved) {
                e.preventDefault();
                drawMain();
                syncInputsWithBox();
                debouncedMaskPreview(120);
                startBtn.disabled = false;
            }
        });



        function updateMaskPreview() {
            if (!selectedBox) return;
            const payload = {
                box: selectedBox,
                dilate: parseInt(dilateSlider.value),
                mode: 'auto'
            };

            fetch('/api/preview-mask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.mask_url) {
                    const mImg = new Image();
                    mImg.onload = () => {
                        maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                        maskCtx.drawImage(mImg, 0, 0, maskCanvas.width, maskCanvas.height);
                        document.getElementById('mask-status').innerHTML = '마스크 적용 완료';
                    };
                    mImg.src = data.mask_url + '?t=' + Date.now();
                }
            });
        }

        function startProcessing() {
            if (!selectedBox) return;

            startBtn.disabled = true;
            // 화면 정중앙 로딩 모달 활성화
            const modal = document.getElementById('progress-modal');
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-percent').textContent = '0%';
            document.getElementById('progress-status').textContent = '워터마크 제거 중...';
            modal.classList.add('active');

            const payload = {
                box: selectedBox,
                dilate: parseInt(dilateSlider.value),
                mode: 'auto'
            };

            fetch('/api/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    modal.classList.remove('active');
                    startBtn.disabled = false;
                    return;
                }
                pollProgress(data.task_id);
            })
            .catch(err => {
                alert('처리 요청 실패: ' + err);
                modal.classList.remove('active');
                startBtn.disabled = false;
            });
        }

        function pollProgress(taskId) {
            const interval = setInterval(() => {
                fetch(`/api/progress/${taskId}`)
                    .then(r => r.json())
                    .then(data => {
                        const percent = Math.round(data.progress * 100);
                        document.getElementById('progress-fill').style.width = percent + '%';
                        document.getElementById('progress-percent').textContent = percent + '%';
                        document.getElementById('progress-status').textContent = data.status || '워터마크 제거 중...';

                        if (data.done) {
                            clearInterval(interval);
                            document.getElementById('progress-modal').classList.remove('active');
                            showResult(data.clean_url, data.orig_url);
                        }
                    });
            }, 500);
        }

        function showResult(cleanUrl, origUrl) {
            // 기존 파일명 기반으로 {파일명}_removed_watermark.mp4 이름 생성
            let downloadName = "video_removed_watermark.mp4";
            if (videoFile && videoFile.name) {
                const lastDot = videoFile.name.lastIndexOf('.');
                const baseName = lastDot !== -1 ? videoFile.name.substring(0, lastDot) : videoFile.name;
                downloadName = `${baseName}_removed_watermark.mp4`;
            }

            // 처리 완료 시 브라우저에서 자동 다운로드 실행
            const autoLink = document.createElement('a');
            autoLink.href = cleanUrl;
            autoLink.download = downloadName;
            document.body.appendChild(autoLink);
            autoLink.click();
            document.body.removeChild(autoLink);

            // 작업 공간 유지 및 버튼 상태 업데이트
            startBtn.disabled = false;
            const originalText = startBtn.textContent;
            startBtn.textContent = '제거 완료 (다운로드됨)';
            startBtn.style.background = '#10b981';
            setTimeout(() => {
                startBtn.textContent = originalText;
                startBtn.style.background = '';
            }, 3500);
        }
    </script>
</body>
</html>
